# Full KeyRing stack: Nest API, Vue SPA frontend and Nuxt SSR shell.
# Build images locally with multi-stage Dockerfiles; no compiled output is versioned.
#
# Usage:
#   docker compose up --build -d
#   API:      http://localhost:3000/api
#   Frontend: http://localhost
#   Nuxt:     http://localhost:3001
services:
  backend:
    build: ./backend
    container_name: keyring-backend
    ports:
      - "3000:3000"
    volumes:
      - keyring-data:/app/data
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/keyring.sqlite
      CORS_ORIGIN: "http://localhost,http://localhost:3001,http://localhost:5173,http://localhost:8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    container_name: keyring-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  nuxt:
    build: ./nuxt
    container_name: keyring-nuxt
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  keyring-data:
