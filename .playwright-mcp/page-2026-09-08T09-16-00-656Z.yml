        - heading "Qué hace" [level=2] [ref=f10e26]
        - paragraph [ref=f10e27]: Seis frentes de la operación, en un mismo tablero.
        - generic [ref=f10e28]:
          - article [ref=f10e29]:
            - heading "Propiedades" [level=3] [ref=f10e33]
            - paragraph [ref=f10e34]: Registra cada inmueble con su modalidad de arriendo, su canon estimado y sus costos fijos. Filtra por ciudad y por tipo.
          - article [ref=f10e35]:
            - heading "Contratos" [level=3] [ref=f10e39]
            - paragraph [ref=f10e40]: Lleva el control de arrendatarios, cánones y fechas. El dashboard avisa cuáles vencen primero.
          - article [ref=f10e41]:
            - heading "Ingresos y gastos" [level=3] [ref=f10e45]
            - paragraph [ref=f10e46]: Registra cada movimiento indicando si viene de Airbnb o de un contrato fijo, y compáralos mes a mes.
          - article [ref=f10e47]:
            - heading "Reportes" [level=3] [ref=f10e51]
            - paragraph [ref=f10e52]: Utilidad por ciudad, distribución del ingreso por fuente y resumen por propiedad, con filtros por tipo y por rango de meses.
          - article [ref=f10e53]:
            - heading "Mapa" [level=3] [ref=f10e57]
            - paragraph [ref=f10e58]: Ubica el portafolio completo sobre el mapa y consulta el estado de cada inmueble desde el marcador.
          - article [ref=f10e59]:
            - heading "Roles" [level=3] [ref=f10e63]
            - paragraph [ref=f10e64]: El propietario ve solo sus inmuebles. El administrador accede a los reportes globales y a la gestión de usuarios.
