        - paragraph [ref=f8e46]: Seis frentes de la operación, en un mismo tablero.
        - generic [ref=f8e47]:
          - article [ref=f8e48]:
            - heading "Propiedades" [level=3] [ref=f8e52]
            - paragraph [ref=f8e53]: Registra cada inmueble con su modalidad de arriendo, su canon estimado y sus costos fijos. Filtra por ciudad y por tipo.
          - article [ref=f8e54]:
            - heading "Contratos" [level=3] [ref=f8e58]
            - paragraph [ref=f8e59]: Lleva el control de arrendatarios, cánones y fechas. El dashboard avisa cuáles vencen primero.
          - article [ref=f8e60]:
            - heading "Ingresos y gastos" [level=3] [ref=f8e64]
            - paragraph [ref=f8e65]: Registra cada movimiento indicando si viene de Airbnb o de un contrato fijo, y compáralos mes a mes.
          - article [ref=f8e66]:
            - heading "Reportes" [level=3] [ref=f8e70]
            - paragraph [ref=f8e71]: Utilidad por ciudad, distribución del ingreso por fuente y resumen por propiedad, con filtros por tipo y por rango de meses.
          - article [ref=f8e72]:
            - heading "Mapa" [level=3] [ref=f8e76]
            - paragraph [ref=f8e77]: Ubica el portafolio completo sobre el mapa y consulta el estado de cada inmueble desde el marcador.
          - article [ref=f8e78]:
            - heading "Roles" [level=3] [ref=f8e82]
            - paragraph [ref=f8e83]: El propietario ve solo sus inmuebles. El administrador accede a los reportes globales y a la gestión de usuarios.
