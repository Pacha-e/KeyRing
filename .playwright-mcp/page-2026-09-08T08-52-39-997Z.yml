        - heading "Qué hace" [level=2] [ref=f5e26]
        - paragraph [ref=f5e27]: Seis frentes de la operación, en un mismo tablero.
        - generic [ref=f5e28]:
          - article [ref=f5e29]:
            - heading "Propiedades" [level=3] [ref=f5e33]
            - paragraph [ref=f5e34]: Registra cada inmueble con su modalidad de arriendo, su canon estimado y sus costos fijos. Filtra por ciudad y por tipo.
          - article [ref=f5e35]:
            - heading "Contratos" [level=3] [ref=f5e39]
            - paragraph [ref=f5e40]: Lleva el control de arrendatarios, cánones y fechas. El dashboard avisa cuáles vencen primero.
          - article [ref=f5e41]:
            - heading "Ingresos y gastos" [level=3] [ref=f5e45]
            - paragraph [ref=f5e46]: Registra cada movimiento indicando si viene de Airbnb o de un contrato fijo, y compáralos mes a mes.
          - article [ref=f5e47]:
            - heading "Reportes" [level=3] [ref=f5e51]
            - paragraph [ref=f5e52]: Utilidad por ciudad, distribución del ingreso por fuente y resumen por propiedad, con filtros por tipo y por rango de meses.
          - article [ref=f5e53]:
            - heading "Mapa" [level=3] [ref=f5e57]
            - paragraph [ref=f5e58]: Ubica el portafolio completo sobre el mapa y consulta el estado de cada inmueble desde el marcador.
          - article [ref=f5e59]:
            - heading "Roles" [level=3] [ref=f5e63]
            - paragraph [ref=f5e64]: El propietario ve solo sus inmuebles. El administrador accede a los reportes globales y a la gestión de usuarios.
